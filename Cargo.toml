[package]
name = "devilution-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A simple Linux launcher for DevilutionX, built with Rust and egui"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
