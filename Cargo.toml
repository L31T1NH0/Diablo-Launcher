[package]
name = "devilution-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Launcher Linux para DevilutionX, feito em Rust e egui"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
